# =====================================================================
# APPLICATION.PROPERTIES - Configuration DSI Dashboard Backend
# Ministère de la Santé - Direction des Systèmes d'Information
# =====================================================================

# ---------------------------------------------------------------------
# INFORMATIONS GÉNÉRALES DE L'APPLICATION
# ---------------------------------------------------------------------
spring.application.name=dsi-dashboard-backend
server.port=8080
# Préfixe global pour toutes les routes de l'API REST
server.servlet.context-path=/api

# ---------------------------------------------------------------------
# CONFIGURATION DE LA BASE DE DONNÉES POSTGRESQL
# ---------------------------------------------------------------------
# URL de connexion : jdbc:postgresql://<hôte>:<port>/<nom_base>
spring.datasource.url=jdbc:postgresql://localhost:5433/dsi_dashboard_db
spring.datasource.username=postgres
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP (intégré par défaut dans Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ---------------------------------------------------------------------
# CONFIGURATION JPA / HIBERNATE
# ---------------------------------------------------------------------
# Dialecte PostgreSQL pour Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Stratégie DDL :
#   - create      : Supprime et recrée le schéma au démarrage (DEV uniquement)
#   - update      : Met à jour le schéma sans supprimer les données (DEV)
#   - validate    : Valide le schéma sans le modifier (PROD recommandé)
#   - none        : Aucune action (PROD avec migration Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL générées dans les logs (désactiver en PROD)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Désactive Open Session In View pour éviter les problèmes de performance
spring.jpa.open-in-view=false

# Nommage physique : convertit les noms camelCase en snake_case pour les colonnes
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ---------------------------------------------------------------------
# CONFIGURATION JWT (JSON Web Token)
# ---------------------------------------------------------------------
# Clé secrète de signature (à stocker en variable d'environnement en PROD !)
# Générée avec au moins 256 bits (32 caractères min) pour HMAC-SHA256
application.jwt.secret=dsi_ministere_sante_jwt_secret_key_very_long_and_secure_2024
# Durée de validité du token en millisecondes (86400000 = 24 heures)
application.jwt.expiration=86400000
# Durée du token de rafraîchissement (604800000 = 7 jours)
application.jwt.refresh-expiration=604800000

# ---------------------------------------------------------------------
# CONFIGURATION SPRING SECURITY
# ---------------------------------------------------------------------
# Désactive la page de login auto-générée (on gère notre propre auth)
spring.security.user.name=admin
spring.security.user.password=admin

# ---------------------------------------------------------------------
# CONFIGURATION SPRINGDOC / SWAGGER UI
# ---------------------------------------------------------------------
# URL d'accès : http://localhost:8080/api/swagger-ui/index.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Activer Swagger en environnement de développement uniquement
springdoc.swagger-ui.enabled=true

# ---------------------------------------------------------------------
# CONFIGURATION DES LOGS
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.ma.gov.sante.dsi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Format du fichier de log (optionnel)
logging.file.name=logs/dsi-dashboard.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------------------------------------------------------------------
# CONFIGURATION CORS (Cross-Origin Resource Sharing)
# ---------------------------------------------------------------------
# Origines autorisées pour le frontend React (port 3000 par défaut)
application.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---------------------------------------------------------------------
# CONFIGURATION MULTIPART (Upload de fichiers)
# ---------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
